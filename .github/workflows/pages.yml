name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow one concurrent deployment; the in-progress run is cancelled on a new push.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build + deploy frontend to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The Pages build is the same SPA, but it talks to the Railway backend and
      # lives under the /NexusAi/ subpath. The deployed Railway bundle is built
      # separately in frontend/Dockerfile with its own VITE_* values.
      - name: Build frontend for Pages
        env:
          VITE_BASE: /NexusAi/
          VITE_API_URL: https://nexusai-production-8c6d.up.railway.app
          VITE_ENABLE_OAUTH: "false"
        run: npm run build

      # GitHub Pages has no SPA fallback for project sites — copy index.html to
      # 404.html so deep links (e.g. /NexusAi/chat) boot the router instead of
      # returning GitHub's 404 page.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
