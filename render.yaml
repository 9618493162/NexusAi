# Render Blueprint — NexusAI backend (free tier, no credit card required)
#
# How to use:
#   1. Sign up at https://render.com (free — no credit card).
#   2. New → Blueprint → connect the GitHub repo 9618493162/NexusAi.
#   3. Render reads this file, creates the `nexusai-backend` web service,
#      and shows blank env-var fields for every `sync: false` key below.
#   4. Paste the values (from your local `nexusai/backend/.env`, with the
#      tweaks in the comments) and hit Apply → it builds and deploys.
#
# The app listens on $PORT (Render injects it at runtime; Docker EXPOSE 5000
# is only a hint). Health check hits the same /api/health used by Railway.

services:
  - type: web
    name: nexusai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://nexus-ai.vercel.app
      - key: CORS_ORIGINS
        value: https://nexus-ai.vercel.app,https://frontend-rouge-alpha-62.vercel.app,https://9618493162.github.io,https://frontend-production-eef8.up.railway.app
      - key: ENABLE_FILE_PROCESSOR
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MEDIA_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: KIMI_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_IMAGE_API_KEY
        sync: false
      - key: FAL_API_KEY
        sync: false
      - key: APIFRAME_API_KEY
        sync: false
      - key: PIXAZO_API_KEY
        sync: false
      - key: VADOO_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: TINYFISH_API_KEY
        sync: false
      - key: MASSIVE_API_KEY
        sync: false
      - key: MAGICSLIDES_API_KEY
        sync: false
      - key: GRID_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
